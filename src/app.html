<!doctype html>
<!--
  Inox UI es una LIBRERÍA (solo `src/lib/`), no una app: nadie sirve este HTML.
  Existe porque `svelte-kit sync` lo exige para generar `.svelte-kit/` (tipos
  ambientales de `$app/*`, tsconfig). Sin él fallaban `npm run package` y
  `npm run check` — y con ellos, cualquier posibilidad de CI. La plantilla de
  librería de SvelteKit incluye este archivo por el mismo motivo.
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
